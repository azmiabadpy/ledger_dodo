name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write


env:
  IMAGE_NAME: ledger-api


jobs:

  security-and-build:

    name: Build, Scan, Sign and Push

    runs-on: ubuntu-latest


    steps:


      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4



      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3



      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      # Secret scanning
      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



      # SAST scanning
      - name: Run Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: auto



      # Dependency vulnerability scanning
      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1



      # Generate image tags
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ledger-api



      # Build image locally for scanning
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          load: true
          push: false
          tags: ledger-api:latest



      # Image vulnerability scan
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ledger-api:latest
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1



      # Push image to GHCR
      - name: Push Docker Image to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}



      # Install Cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3



      # Keyless signing using GitHub OIDC
      - name: Sign Docker Image with Cosign
        run: |

          cosign sign --yes \
          ghcr.io/${{ github.repository_owner }}/ledger-api@${{ steps.push.outputs.digest }}



      # Generate SLSA provenance attestation
      - name: Generate SLSA Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ledger-api
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
