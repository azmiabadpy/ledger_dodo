apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: developer-binding
  namespace: payments

subjects:

- kind: User
  name: developer

roleRef:

  kind: Role
  name: developer-role
  apiGroup: rbac.authorization.k8s.io


