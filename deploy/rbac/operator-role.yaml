apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: operator-role
  namespace: payments

rules:

# Manage application deployments
- apiGroups:
    - apps

  resources:
    - deployments
    - replicasets

  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch

# Restart pods if required
- apiGroups: [""]

  resources:
    - pods

  verbs:
    - get
    - list
    - delete
