apiVersion: v1
kind: ServiceAccount

metadata:
  name: reporting
  namespace: payments

# This service does not need Kubernetes API access
automountServiceAccountToken: false


---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: reporting
  namespace: payments

  labels:
    app: reporting


spec:

  # Single replica because this is only a neighbour/test service
  replicas: 1


  selector:

    matchLabels:
      app: reporting


  template:

    metadata:

      labels:
        app: reporting


    spec:

      # Dedicated ServiceAccount instead of default SA
      serviceAccountName: reporting


      # Pod security configuration
      securityContext:

        # Container must not run as root
        runAsNonRoot: true

        # Default Kubernetes seccomp profile
        seccompProfile:
          type: RuntimeDefault



      containers:

      - name: client


        # Pinned image version for security
        image: curlimages/curl@sha256:73e4d532ea62d7505c5865b517d3704966ffe916609bedc22af6833dc9969bcd



        # Keep container alive continuously
        command:

        - sleep


        args:

        - infinity



        securityContext:


          # Run container as non-root user
          runAsUser: 1000
          runAsGroup: 1000


          # Prevent privilege escalation
          allowPrivilegeEscalation: false


          # Read-only filesystem
          readOnlyRootFilesystem: true


          # Drop unnecessary Linux capabilities
          capabilities:

            drop:
            - ALL



        resources:


          requests:

            cpu: "50m"
            memory: "64Mi"


          limits:

            cpu: "200m"
            memory: "128Mi"



        # Container health check
        livenessProbe:

          exec:

            command:

            - sh
            - -c
            - "true"


          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3



        # Container readiness check
        readinessProbe:

          exec:

            command:

            - sh
            - -c
            - "true"


          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
