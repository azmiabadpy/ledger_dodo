apiVersion: v1
kind: ServiceAccount

metadata:
  name: reporting
  namespace: payments

# This service does not need Kubernetes API access,
# so we disable automatic token mounting
automountServiceAccountToken: false

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: reporting
  namespace: payments

  labels:
    app: reporting

spec:

  # Single replica because this is only a neighbour service
  replicas: 1

  selector:
    matchLabels:
      app: reporting

  template:

    metadata:
      labels:
        app: reporting

    spec:

      # Using dedicated ServiceAccount instead of default SA
      # because every application should have its own identity
      serviceAccountName: reporting

      # Pod level security configuration
      securityContext:

        # Container must run without root privileges
        runAsNonRoot: true

        # Use default Kubernetes seccomp profile
        seccompProfile:
          type: RuntimeDefault


      containers:

        - name: client

          # Neighbour service image
          image: curlimages/curl@sha256:73e4d532ea62d7505c5865b517d3704966ffe916609bedc22af6833dc9969bcd

          # Keep container running for testing communication
          command:
            - sleep

          args:
            - "3600"


          securityContext:

            # Run container with non-root user
            runAsUser: 1000
            runAsGroup: 1000

            # Prevent gaining additional privileges
            allowPrivilegeEscalation: false

            # Make container filesystem read-only
            readOnlyRootFilesystem: true

            # Remove unnecessary Linux capabilities
            capabilities:

              drop:
                - ALL


          resources:

            # Minimum resources required by container
            requests:

              cpu: "50m"
              memory: "64Mi"


            # Maximum resources allowed
            limits:

              cpu: "200m"
              memory: "128Mi"



          # Check container is alive
          livenessProbe:

            exec:

              command:

                - sh
                - -c
                - "curl --version"

            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5



          # Check container is ready
          readinessProbe:

            exec:

              command:

                - sh
                - -c
                - "curl --version"

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 4
