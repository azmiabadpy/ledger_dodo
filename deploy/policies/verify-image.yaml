apiVersion: kyverno.io/v1
kind: ClusterPolicy

metadata:
  name: verify-image-signature

spec:

  validationFailureAction: Enforce

  rules:

    - name: verify-image

      match:

        any:
          - resources:
              kinds:
                - Pod


      exclude:

        any:

          - resources:

              namespaces:
                - payments

              selector:

                matchLabels:
                  app: reporting


      verifyImages:

        - imageReferences:

            - "ghcr.io/azmiabadpy/ledger-api*"


          required: true

          mutateDigest: true

          verifyDigest: true


          attestors:

            - entries:

                - keyless:

                    issuer: https://token.actions.githubusercontent.com

                    subjectRegExp: >-
                      https://github.com/azmiabadpy/ledger_dodo/.github/workflows/secure-pipeline.yaml@refs/heads/main

                    rekor:
                      url: https://rekor.sigstore.dev
