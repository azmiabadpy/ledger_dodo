apiVersion: kyverno.io/v1
kind: ClusterPolicy

metadata:
  name: require-non-root

spec:

  # Block workloads that do not run as non-root
  validationFailureAction: Enforce

  # Check existing resources also
  background: true


  rules:

    - name: check-container-runs-as-non-root


      match:

        any:

          - resources:

              kinds:

                - Pod


      # Exclude platform components
      # ArgoCD manages the cluster and has its own security requirements
      exclude:

        any:

          - resources:

              namespaces:

                - argocd
                - istio-system


      validate:

        message: "Container must run as non-root user"


        pattern:

          spec:

            securityContext:

              runAsNonRoot: true
